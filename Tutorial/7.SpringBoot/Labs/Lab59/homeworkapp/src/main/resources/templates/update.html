<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <title>Edit Item — Mobile Stock</title>
</head>
<body>

  <div th:replace="navigation :: navigation"></div>

  <div class="page-wrapper">


    <div class="form-card">
      <form action="#" th:action="@{/update/{id}(id=${productDetails.id})}" method="post" novalidate>

        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" type="text" id="name" name="name"
                 th:value="${productDetails.name}" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <input class="form-control" type="text" id="description" name="description"
                 th:value="${productDetails.description}" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="price">Price</label>
          <input class="form-control mono" type="text" id="price" name="price"
                 th:value="${productDetails.price}" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <i class="ti ti-device-floppy" aria-hidden="true"></i>
            Save changes
          </button>
          <a th:href="@{/all}" class="btn btn-ghost">Cancel</a>
        </div>

      </form>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
