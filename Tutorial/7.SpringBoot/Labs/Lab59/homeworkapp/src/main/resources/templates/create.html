<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <title>Add Item — Mobile Stock</title>
</head>
<body>

  <div th:replace="navigation :: navigation"></div>

  <div class="page-wrapper">


    <div th:if="${message}" class="alert alert-success" role="alert">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
      <span th:text="${message}"></span>
    </div>

    <div class="form-card">
      <form action="#" th:action="@{/create}" method="post" novalidate>

        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" type="text" id="name" name="name"
                 placeholder="e.g. iPhone 15 Pro" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <input class="form-control" type="text" id="description" name="description"
                 placeholder="e.g. 256GB, Space Black" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="price">Price</label>
          <input class="form-control mono" type="text" id="price" name="price"
                 placeholder="e.g. 1299.00" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <i class="ti ti-device-floppy" aria-hidden="true"></i>
            Save item
          </button>
          <a th:href="@{/all}" class="btn btn-ghost">Cancel</a>
        </div>

      </form>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
