<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <title>Delete Item — Mobile Stock</title>
</head>
<body>

  <div th:replace="navigation :: navigation"></div>

  <div class="page-wrapper">


    <div class="confirm-card">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      <span>
        You are about to permanently delete
        <strong th:text="${productDetails.name}"></strong>.
        This action cannot be undone.
      </span>
    </div>

    <div class="form-card">
      <form action="#" th:action="@{/delete/{id}(id=${productDetails.id})}" method="post">
        <input type="hidden" name="name" th:value="${productDetails.name}" />
        <div class="form-actions" style="margin-top:0; padding-top:0; border-top:none;">
          <button type="submit" class="btn btn-danger">
            <i class="ti ti-trash" aria-hidden="true"></i>
            Yes, delete
          </button>
          <a th:href="@{/all}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
