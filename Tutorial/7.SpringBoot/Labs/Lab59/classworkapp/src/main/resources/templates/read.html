<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	 <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Student List</title>
</head>
<body>
	<div th:replace="navigation :: navigation"></div>

<div class="page-container">
    <div class="card card-custom">
        
        <h1 class="mb-4 text-center"> Students List</h1>

        <form class="d-flex mb-3" th:action="@{/all}" method="get">
            <input class="form-control me-2" type="text" name="keyword" placeholder="Search students..." />
            <button class="btn btn-primary btn-custom">Search</button>
        </form>

        <table class="table table-hover text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Grade</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.standard}"></td>
                    <td th:text="${student.age}"></td>
                    <td>
                        <a class="action-link action-edit" th:href="@{/update/{id}(id=${student.id})}">Edit</a>
                        <a class="action-link action-delete" th:href="@{/delete/{id}(id=${student.id})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</div>
</body>
</html>
