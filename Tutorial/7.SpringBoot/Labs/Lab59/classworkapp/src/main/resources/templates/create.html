<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	 <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Create School Database</title>
</head>
<body>
	<div th:replace="navigation :: navigation"></div>
  
  <div class="page-container">
      <div class="card card-custom">

          <h1 class="mb-4 text-center"> Add Student</h1>

          <p class="text-success text-center" th:text="${message}"></p>

          <form th:action="@{/create}" method="post">

              <div class="mb-3">
                  <label>Name</label>
                  <input class="form-control" type="text" name="name" required />
              </div>

              <div class="mb-3">
                  <label>Class</label>
                  <input class="form-control" type="text" name="standard" required />
              </div>

              <div class="mb-3">
                  <label>Age</label>
                  <input class="form-control" type="text" name="age" required />
              </div>

              <button class="btn btn-success btn-custom w-100">Create</button>
          </form>

      </div>
  </div>
</body>
</html>
