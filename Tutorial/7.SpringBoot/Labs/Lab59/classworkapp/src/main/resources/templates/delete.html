<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	 <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Delete Student Information</title>
</head>
<body>
	<div th:replace="navigation :: navigation"></div>
	
	<div class="page-container">
	    <div class="card card-custom text-center">

	        <h1 class="mb-3 text-danger"> Delete Student</h1>

	        <p>
	            Are you sure you want to delete 
	            <strong th:text="${studentDetails.name}"></strong>?
	        </p>

	        <form th:action="@{/delete/{id}(id=${studentDetails.id})}" method="post">
	            <button class="btn btn-danger btn-custom me-2">Delete</button>
	            <a href="/all" class="btn btn-secondary btn-custom">Cancel</a>
	        </form>

	    </div>
	</div>
</body>
</html>
