<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	 <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Update Database</title>
</head>
<body>
	<div th:replace="navigation :: navigation"></div>

<div class="page-container">
    <div class="card card-custom">

        <h1 class="mb-4 text-center"> Update Student</h1>

        <form th:action="@{/update/{id}(id=${studentDetails.id})}" method="post">

            <div class="mb-3">
                <label>Name</label>
                <input class="form-control" type="text" name="name" th:value="${studentDetails.name}" />
            </div>

            <div class="mb-3">
                <label>Grade</label>
                <input class="form-control" type="text" name="standard" th:value="${studentDetails.standard}" />
            </div>

            <div class="mb-3">
                <label>Age</label>
                <input class="form-control" type="text" name="age" th:value="${studentDetails.age}" />
            </div>

            <button class="btn btn-primary btn-custom w-100">Update</button>
        </form>

    </div>
</div>
</body>
</html>
