<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mobile Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="navigation :: navigation"></div>

<div class="container">

    <!-- PAGE TITLE -->
    <h2 class="text-center mb-4">📱 Add New Stock</h2>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${message}" class="alert alert-success text-center">
        <span th:text="${message}"></span>
    </div>

    <!-- FORM CARD -->
    <div class="card p-4 shadow-lg mx-auto" style="max-width: 500px;">

        <form th:action="@{/mobilesave}" method="post">

            <!-- NAME -->
            <div class="mb-3">
                <label class="form-label"> Mobile Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter mobile name" required>
            </div>

            <!-- BRAND -->
            <div class="mb-3">
                <label class="form-label"> Brand</label>
                <input type="text" name="brand" class="form-control" placeholder="Enter brand" required>
            </div>

            <!-- PRICE -->
            <div class="mb-3">
                <label class="form-label"> Price (₹)</label>
                <input type="number" name="price" class="form-control" placeholder="Enter price" required>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-primary w-100 mt-3">
                 Save Mobile
            </button>

        </form>

    </div>

</div>

</body>
</html>
