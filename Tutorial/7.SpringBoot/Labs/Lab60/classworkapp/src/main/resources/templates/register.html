<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
     <link rel="stylesheet" th:href="@{css/style.css}">
</head>
<body>
	<div class="container d-flex justify-content-center align-items-center my-3">
	        <div class="card shadow-lg p-4 register-card">
	            
	            <h2 class="text-center mb-4">Registration Form</h2>

	            <form th:action="@{/registration}" method="post" th:object="${user}" autocomplete="off">
	                
	                <div class="form-group mb-3">
	                    <label>Name</label>
	                    <input th:field="*{fullname}" type="text" class="form-control" placeholder="Enter your fullname" required>
	                </div>

	                <div class="form-group mb-3">
	                    <label>Email</label>
	                    <input th:field="*{email}" type="email" class="form-control" placeholder="Enter your email" required>
	                </div>

	                <div class="form-group mb-3">
	                    <label>Mobile</label>
	                    <input th:field="*{mob}" type="text" class="form-control" placeholder="Enter your mobile number" required>
	                </div>

	                <div class="form-group mb-3">
	                    <label>Password</label>
	                    <input th:field="*{password}" type="password" id="password" class="form-control" placeholder="Enter password" required>
	                </div>

	                <div class="form-group mb-4">
	                    <label>Confirm Password</label>
	                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
	                </div>

	                <button type="submit" class="btn btn-primary w-100" onclick="return Validate()">Register</button>
	            </form>

	            <div class="alert alert-success mt-3 text-center" th:if="${message != null}">
	                [[${message}]]
	            </div>

	        </div>
	    </div>
	</body>
		
       
    </div>
    <script>
    	function Validate() {
        	var password = document.getElementById("password").value;
        	var confirmPassword = document.getElementById("confirmPassword").value;
        	if (password != confirmPassword) {
          	// alert("Passwords do not match.");
           	$('#myModal').modal();
           
    		return false;
        }
        return true;
    }         
	</script>


	<div class="modal" id="myModal">
    	<div class="modal-dialog">
      		<div class="modal-content">
        		<div class="modal-header">
          			<h4 style="color: red" class="modal-title">Alert</h4>
          			<button type="button" class="close" data-dismiss="modal"></button>
        		</div>
        		<div class="modal-body">
       				<p style="color: red">Password do not match</p>
        		</div>
        		<div class="modal-footer">
          			<button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
        		</div>
        	</div>
    	</div>
   </div> 
</body>
</html>
