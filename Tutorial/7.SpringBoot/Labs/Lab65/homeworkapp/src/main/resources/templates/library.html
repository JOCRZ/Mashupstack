<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Collection</title>
</head>
<body>
    <h2>Our Book Collection</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Description</th>
                <th>Published Date</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterate through the 'books' list sent by the Controller -->
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.price}"></td>
                <!-- Use the getter names from your Java class -->
                <td th:text="${book.desc}"></td> 
                <td th:text="${book.pdate}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
