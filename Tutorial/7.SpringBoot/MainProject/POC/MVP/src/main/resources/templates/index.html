<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Link Preview Generator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container mt-5">

    <!-- Input Card -->
    <div class="card p-4 shadow-lg border-0 rounded-4">

        <h1 class="text-center mb-4">

            Link Preview Generator

        </h1>

        <form th:action="@{/extract}"
              method="post">

            <input type="text"
                   name="url"
                   class="form-control form-control-lg mb-3"
                   placeholder="Enter URL"
                   required>

            <button class="btn btn-primary btn-lg w-100">

                Generate Preview

            </button>

        </form>

    </div>

    <!-- Preview Card -->

    <div th:if="${preview}"
         class="preview-card mt-5">

        <!-- Preview Image -->

        <img th:if="${preview.image != null and !preview.image.isEmpty()}"
             th:src="${preview.image}"
             class="preview-image">

        <!-- Preview Content -->

        <div class="preview-content">

            <h3 th:text="${preview.title}"></h3>

            <p th:text="${preview.description}"></p>

            <!-- Show only main URL -->

            <small class="text-muted"
                   th:text="${preview.displayUrl}">
            </small>

            <br><br>

            <!-- Copy Button -->

            <button class="btn btn-success btn-sm"
                    th:attr="data-url=${preview.url}"
                    onclick="copyLink(this)">

                Copy Full Link

            </button>

            <span id="copy-message"
                  class="ms-2 text-success fw-bold">
            </span>

        </div>

    </div>

</div>

<!-- Copy Script -->

<script>

    function copyLink(button) {

        const url =
            button.getAttribute("data-url");

        navigator.clipboard.writeText(url);

        document.getElementById(
            "copy-message").innerText =
            "Link copied!";
    }

</script>

</body>
</html>
