<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>

<body>

<div class="auth-card">

    <h2 class="auth-title">Signup</h2>

    <div class="auth-switch">

        <a th:href="@{/login}">
            Login
        </a>

        <a class="active"
           th:href="@{/registration}">
            Signup
        </a>

    </div>

    <div class="message"
         th:if="${message != null}">

        [[${message}]]

    </div>

    <form th:action="@{/registration}"
          method="post"
          th:object="${user}">

        <div class="form-group">

			<input
			      th:field="*{email}"
			      type="email"
			      class="form-control"
			      placeholder="Email Address"
			      required>

        </div>



        <div class="form-group">

            <input
                th:field="*{password}"
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
                required>

        </div>

        <div class="form-group">

            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm Password"
                required>

        </div>

        <button type="submit"
                class="btn-auth"
                onclick="return Validate()">

            Signup

        </button>

    </form>

    <div class="bottom-text">

        Already have an account?

        <a th:href="@{/login}">
            Login now
        </a>

    </div>

</div>

<script>

function Validate(){

    var password =
        document.getElementById("password").value;

    var confirmPassword =
        document.getElementById("confirmPassword").value;

    if(password != confirmPassword){

        alert("Passwords do not match");

        return false;
    }

    return true;
}

</script>

</body>
</html>
