<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bookmark Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>
            <h2>
                Welcome,
                <span th:text="${user.username}"></span>
            </h2>

            <p class="text-muted">
                <span th:text="${bookmarkCount}"></span>
                / 5 bookmarks used
            </p>
        </div>

        <a th:href="@{/logout}"
           class="btn btn-dark">
            Logout
        </a>

    </div>

    <!-- ========================= -->
    <!-- ALERTS -->
    <!-- ========================= -->

    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>

    <!-- ========================= -->
    <!-- SEARCH -->
    <!-- ========================= -->

    <form th:action="@{/dashboard}"
          method="get"
          class="mb-4">

        <div class="input-group">

            <input type="text"
                   name="keyword"
                   class="form-control"
                   placeholder="Search bookmarks">

            <button class="btn btn-primary">
                Search
            </button>

        </div>

    </form>

    <!-- ========================= -->
    <!-- ADD BUTTON -->
    <!-- ========================= -->

    <button class="btn btn-success mb-4"
            data-bs-toggle="modal"
            data-bs-target="#bookmarkModal"
            onclick="openCreateModal()">

        Add Bookmark

    </button>

    <!-- ========================= -->
    <!-- BOOKMARK TABLE -->
    <!-- ========================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>Title</th>
                    <th>URL</th>
                    <th>Added</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="bookmark : ${bookmarks}">

                    <td th:text="${bookmark.title}"></td>

                    <td>

                        <a th:href="${bookmark.url}"
                           target="_blank"
                           th:text="${bookmark.displayUrl}">

                        </a>

                    </td>

                    <td th:text="${bookmark.addedTime}"></td>

                    <td>

                        <!-- EDIT -->

                        <button class="btn btn-warning btn-sm"

                                data-bs-toggle="modal"

                                data-bs-target="#bookmarkModal"

                                th:attr="
                                    data-id=${bookmark.id},
                                    data-title=${bookmark.title},
                                    data-url=${bookmark.url},
                                    data-displayurl=${bookmark.displayUrl}"

                                onclick="openEditModal(this)">

                            Edit

                        </button>

                        <!-- DELETE -->

                        <button class="btn btn-danger btn-sm"

                                data-bs-toggle="modal"

                                data-bs-target="#deleteModal"

                                th:attr="
                                    data-id=${bookmark.id},
                                    data-title=${bookmark.title}"

                                onclick="openDeleteModal(this)">

                            Delete

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- CREATE + UPDATE MODAL -->
<!-- ========================= -->

<div class="modal fade"
     id="bookmarkModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form id="bookmarkForm"
                  method="post">

                <div class="modal-header">

                    <h5 class="modal-title"
                        id="modalTitle">

                        Add Bookmark

                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body">

                    <!-- TITLE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        <input type="text"
                               name="title"
                               id="title"
                               class="form-control">

                    </div>

                    <!-- URL -->

                    <div class="mb-3">

                        <label class="form-label">
                            URL
                        </label>

                        <input type="text"
                               name="url"
                               id="url"
                               class="form-control">

                    </div>

                    <!-- DISPLAY URL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Display URL
                        </label>

                        <input type="text"
                               name="displayUrl"
                               id="displayUrl"
                               class="form-control">

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="submit"
                            class="btn btn-primary">

                        Save

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- DELETE MODAL -->
<!-- ========================= -->

<div class="modal fade"
     id="deleteModal"
     tabindex="-1">

    <div class="modal-dialog modal-sm">

        <div class="modal-content">

            <form id="deleteForm"
                  method="post">

                <div class="modal-body text-center">

                    <h5 class="mb-3">
                        Delete Bookmark?
                    </h5>

                    <p id="deleteBookmarkTitle"></p>

                    <button class="btn btn-danger">
                        Delete
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>

    // =========================
    // CREATE MODAL
    // =========================

    function openCreateModal() {

        document.getElementById("modalTitle")
            .innerText = "Add Bookmark";

        document.getElementById("bookmarkForm")
            .action = "/save";

        document.getElementById("title").value = "";

        document.getElementById("url").value = "";

        document.getElementById("displayUrl").value = "";
    }


    // =========================
    // EDIT MODAL
    // =========================

    function openEditModal(button) {

        const id =
            button.getAttribute("data-id");

        const title =
            button.getAttribute("data-title");

        const url =
            button.getAttribute("data-url");

        const displayUrl =
            button.getAttribute("data-displayurl");


        document.getElementById("modalTitle")
            .innerText = "Edit Bookmark";

        document.getElementById("bookmarkForm")
            .action = "/update/" + id;

        document.getElementById("title")
            .value = title;

        document.getElementById("url")
            .value = url;

        document.getElementById("displayUrl")
            .value = displayUrl;
    }


    // =========================
    // DELETE MODAL
    // =========================

    function openDeleteModal(button) {

        const id =
            button.getAttribute("data-id");

        const title =
            button.getAttribute("data-title");

        document.getElementById("deleteForm")
            .action = "/delete/" + id;

        document.getElementById("deleteBookmarkTitle")
            .innerText = title;
    }

</script>

<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
