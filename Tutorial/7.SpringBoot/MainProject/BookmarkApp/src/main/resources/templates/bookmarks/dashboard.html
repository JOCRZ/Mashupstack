<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>My Bookmarks</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>

    <link th:href="@{/css/bookmarks.css}"
          rel="stylesheet"/>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <a class="navbar-brand"
       th:href="@{/bookmarks}">

        <i class="bi bi-bookmark-check-fill"></i>

        My Bookmarks

    </a>

    <div class="user-pill">
		
	
		<div class="user-avatar" th:title="${useremail}">
		    <i class="bi bi-person-fill"></i>
		</div>
		<span th:text="'Hai, ' + ${username} + '!'"></span>
        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="btn-auth">

                Logout

            </button>

        </form>

    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<div class="main-wrap">

    <!-- SUCCESS -->

    <div th:if="${successMsg}"
         class="flash flash-success">

        <i class="bi bi-check-circle-fill"></i>

        <span th:text="${successMsg}"></span>

    </div>

    <!-- ERROR -->

    <div th:if="${errorMsg}"
         class="flash flash-error">

        <i class="bi bi-exclamation-circle-fill"></i>

        <span th:text="${errorMsg}"></span>

    </div>

    <div class="layout">

        <div>

            <!-- =========================
                 ADD BOOKMARK
            ========================= -->

            <div class="add-card">

                <div class="add-card-title">

                    <div class="icon-wrap">

                        <i class="bi bi-link-45deg"></i>

                    </div>

                    Add New Bookmark

                </div>

                <p class="add-card-hint">

                    <i class="bi bi-magic"
                       style="color:var(--primary)"></i>

                    Paste URL and preview metadata before saving.

                </p>

                <form id="previewForm">

                    <div class="add-form-row">

                        <input class="url-input"
                               type="url"
                               id="previewUrl"
                               placeholder="Paste URL"
                               required/>

                        <button class="btn-add"
                                type="submit">

                            <i class="bi bi-plus-lg"></i>

                            Preview

                        </button>

                    </div>

                </form>

            </div>


            <!-- =========================
                 SEARCH
            ========================= -->

            <form th:action="@{/bookmarks}"
                  method="get"
                  class="controls">

                <div class="search-wrap">

                    <i class="bi bi-search"></i>

                    <input class="search-input"
                           name="keyword"
                           type="text"
                           placeholder="Search bookmarks..."
                           th:value="${keyword}"/>

                </div>

                <button type="submit"
                        class="btn-search">

                    <i class="bi bi-search"></i>

                    Search

                </button>

            </form>


            <!-- =========================
                 TABLE
            ========================= -->

            <div class="table-card">

                <table class="bk-table">

                    <thead>

                    <tr>

                        <th>Title</th>

                        <th>Link</th>

                        <th>Timestamp</th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="bookmarkTableBody">

                    <!-- EMPTY STATE (shown by JS when no rows) -->

                    <tr th:if="${#lists.isEmpty(bookmarks)}"
                        id="emptyRow">

                        <td colspan="4">

                            <div class="empty-state">

                                <i class="bi bi-bookmark-x"></i>

                                <p>No bookmarks found</p>

                            </div>

                        </td>

                    </tr>

                    <!-- BOOKMARKS — all rows rendered, JS handles visibility -->

                    <tr class="bk-row"
                        th:each="bk : ${bookmarks}">

                        <!-- TITLE -->

                        <td>

                            <div class="bk-title"
                                 th:text="${bk.title}">
                            </div>

                            <div class="bk-domain"
                                 th:text="${bk.displayUrl}">
                            </div>

                        </td>

                        <!-- URL -->

                        <td class="bk-link">

                            <a th:href="${bk.url}"
                               target="_blank"
                               th:text="${bk.url}">
                            </a>

                        </td>

                        <!-- DATE — FIXED: was ${bk.formattedDate} -->

                        <td class="bk-date"
                            th:text="${bk.addedTime != null}
                                     ? ${#temporals.format(bk.addedTime, 'dd MMM yyyy, hh:mm a')}
                                     : ''">
                        </td>

                        <!-- ACTIONS -->

                        <td>

                            <div style="display:flex;gap:8px;justify-content:center">

                                <!-- EDIT -->

                                <button type="button"

                                        class="btn-icon edit"

                                        th:attr="
                                        data-id=${bk.id},
                                        data-title=${bk.title},
                                        data-url=${bk.url},
                                        data-display=${bk.displayUrl}"

                                        onclick="openEditModal(this)">

                                    <i class="bi bi-pencil"></i>

                                </button>

                                <!-- DELETE -->

                                <button type="button"

                                        class="btn-icon del"

                                        th:attr="data-id=${bk.id}"

                                        onclick="openDeleteModal(this)">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

                <!-- =========================
                     PAGINATION
                ========================= -->

                <div class="pagination-wrap"
                     id="paginationWrap">

                    <!-- LEFT: info + page size -->

                    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">

                        <span class="pagination-info"
                              id="pageInfo">
                        </span>

                        <div class="page-size-wrap">

                            Rows per page:

                            <select class="page-size-select"
                                    id="pageSizeSelect"
                                    onchange="changePageSize(this.value)">

                                <option value="2">2</option>

                                <option value="5" selected>5</option>

                            </select>

                        </div>

                    </div>

                    <!-- RIGHT: prev / page numbers / next -->

                    <div class="pagination-controls"
                         id="pageControls">
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             STAT CARD
        ========================= -->

        <div>

            <div class="stat-card">

                <div class="stat-icon-wrap">

                    <i class="bi bi-bookmark-fill"></i>

                </div>

                <div class="stat-number"
                     th:text="${totalCount}">

                    0

                </div>

                <div class="stat-label">

                    Total Bookmarks

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     CREATE MODAL
========================= -->

<div class="modal-overlay"
     id="createModal">

    <div class="modal-box">

        <div class="modal-title">

            <i class="bi bi-plus-circle"
               style="color:var(--primary)"></i>

            Save Bookmark

        </div>

        <form th:action="@{/bookmarks/save}"
              method="post">

            <label class="modal-label">Title</label>

            <input class="modal-input"
                   type="text"
                   id="modalTitle"
                   name="title">

            <label class="modal-label">URL</label>

            <input class="modal-input"
                   type="url"
                   id="modalUrl"
                   name="url"
                   required>

            <label class="modal-label">Display URL</label>

            <input class="modal-input"
                   type="text"
                   id="modalDisplayUrl"
                   name="displayUrl">

            <div class="modal-actions">

                <button type="button"
                        class="btn-cancel"
                        onclick="closeCreateModal()">

                    Cancel

                </button>

                <button type="submit"
                        class="btn-save">

                    Save Bookmark

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     EDIT MODAL
========================= -->

<div class="modal-overlay"
     id="editModal">

    <div class="modal-box">

        <div class="modal-title">

            <i class="bi bi-pencil-square"
               style="color:var(--primary)"></i>

            Edit Bookmark

        </div>

        <form id="editForm"
              method="post">

            <label class="modal-label">Title</label>

            <input class="modal-input"
                   type="text"
                   id="editTitle"
                   name="title">

            <label class="modal-label">URL</label>

            <input class="modal-input"
                   type="url"
                   id="editUrl"
                   name="url"
                   required>

            <label class="modal-label">Display URL</label>

            <input class="modal-input"
                   type="text"
                   id="editDisplayUrl"
                   name="displayUrl">

            <div class="modal-actions">

                <button type="button"
                        class="btn-cancel"
                        onclick="closeEditModal()">

                    Cancel

                </button>

                <button type="submit"
                        class="btn-save">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     DELETE MODAL
========================= -->

<div class="modal-overlay"
     id="deleteModal">

    <div class="modal-box delete-box">

        <div class="modal-title">

            <i class="bi bi-trash"
               style="color:red"></i>

            Delete Bookmark

        </div>

        <p style="margin-top:15px">

            Are you sure you want to delete this bookmark?

        </p>

        <form id="deleteForm"
              method="post">

            <div class="modal-actions">

                <button type="button"
                        class="btn-cancel"
                        onclick="closeDeleteModal()">

                    Cancel

                </button>

                <button type="submit"
                        class="btn-save">

                    Delete

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

// ==========================================
// PAGINATION
// ==========================================

let currentPage = 1;
let pageSize    = 5;

function getRows() {
    return Array.from(
        document.querySelectorAll("#bookmarkTableBody .bk-row")
    );
}

function totalPages() {
    const rows = getRows();
    return rows.length === 0
        ? 1
        : Math.ceil(rows.length / pageSize);
}

function renderPage(page) {

    const rows  = getRows();
    const total = totalPages();

    // Clamp page
    if (page < 1)      page = 1;
    if (page > total)  page = total;

    currentPage = page;

    const start = (currentPage - 1) * pageSize; // inclusive
    const end   = start + pageSize;              // exclusive

    rows.forEach(function(row, index) {
        row.style.display =
            (index >= start && index < end)
                ? ""
                : "none";
    });

    // Info text
    const showing = Math.min(end, rows.length) - start;
    document.getElementById("pageInfo").textContent =
        rows.length === 0
            ? ""
            : "Showing " + (start + 1) + "–" + Math.min(end, rows.length)
              + " of " + rows.length;

    // Hide pagination bar if 0 or 1 page
    document.getElementById("paginationWrap").style.display =
        rows.length === 0 ? "none" : "flex";

    // Build page number buttons
    const controls = document.getElementById("pageControls");
    controls.innerHTML = "";

    // PREV button
    const prev = document.createElement("button");
    prev.className   = "btn-page";
    prev.innerHTML   = '<i class="bi bi-chevron-left"></i>';
    prev.disabled    = currentPage === 1;
    prev.onclick     = function() { renderPage(currentPage - 1); };
    controls.appendChild(prev);

    // Page number buttons
    for (let i = 1; i <= total; i++) {

        const btn = document.createElement("button");
        btn.className = "btn-page" + (i === currentPage ? " active" : "");
        btn.textContent = i;
        btn.onclick = (function(p) {
            return function() { renderPage(p); };
        })(i);
        controls.appendChild(btn);
    }

    // NEXT button
    const next = document.createElement("button");
    next.className   = "btn-page";
    next.innerHTML   = '<i class="bi bi-chevron-right"></i>';
    next.disabled    = currentPage === total;
    next.onclick     = function() { renderPage(currentPage + 1); };
    controls.appendChild(next);
}

function changePageSize(value) {
    pageSize    = parseInt(value, 10);
    currentPage = 1;
    renderPage(1);
}

// Boot pagination on load
document.addEventListener("DOMContentLoaded", function() {
    renderPage(1);
});


// ==========================================
// PREVIEW URL
// ==========================================

document.getElementById("previewForm")

.addEventListener("submit", async function(e) {

    e.preventDefault();

    const url =
        document.getElementById("previewUrl").value;

    try {

        const response =
            await fetch("/bookmarks/preview", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({ url: url })
            });

        const data = await response.json();

        document.getElementById("modalTitle").value =
            data.title || "";

        document.getElementById("modalUrl").value =
            data.url || "";

        document.getElementById("modalDisplayUrl").value =
            data.displayUrl || "";

        document.getElementById("createModal")
            .classList.add("show");

    } catch(error) {

        alert("Metadata extraction failed");
    }
});


// ==========================================
// EDIT MODAL
// ==========================================

function openEditModal(button) {

    document.getElementById("editTitle").value =
        button.dataset.title;

    document.getElementById("editUrl").value =
        button.dataset.url;

    document.getElementById("editDisplayUrl").value =
        button.dataset.display;

    document.getElementById("editForm").action =
        "/bookmarks/update/" + button.dataset.id;

    document.getElementById("editModal")
        .classList.add("show");
}

function closeEditModal() {

    document.getElementById("editModal")
        .classList.remove("show");
}


// ==========================================
// CREATE MODAL
// ==========================================

function closeCreateModal() {

    document.getElementById("createModal")
        .classList.remove("show");
}


// ==========================================
// DELETE MODAL
// ==========================================

function openDeleteModal(button) {

    document.getElementById("deleteForm").action =
        "/bookmarks/delete/" + button.dataset.id;

    document.getElementById("deleteModal")
        .classList.add("show");
}

function closeDeleteModal() {

    document.getElementById("deleteModal")
        .classList.remove("show");
}


// ==========================================
// OUTSIDE CLICK — CLOSE MODAL
// ==========================================

document.querySelectorAll(".modal-overlay")

.forEach(function(overlay) {

    overlay.addEventListener("click", function(e) {

        if (e.target === overlay) {

            overlay.classList.remove("show");
        }
    });
});

</script>

</body>
</html>
