<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>

    <style>

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e4f5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-card {
            background: #fff;
            border-radius: 14px;
            padding: 35px 40px;
            width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            border: 1px solid rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease-in-out;
        }

        .error-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d4d, #ff1a75);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            color: white;
            font-size: 30px;
            box-shadow: 0 6px 15px rgba(255, 0, 80, 0.25);
        }

        h2 {
            color: #ff1a75;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-back {
            background: linear-gradient(135deg, #6c63ff, #4e73df);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 500;
            transition: 0.25s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(78, 115, 223, 0.35);
            color: white;
        }

        .error-msg {
            background: #fff3f3;
            border: 1px solid #ffd6d6;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #b30000;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-10px);}
            to {opacity: 1; transform: translateY(0);}
        }

    </style>
</head>

<body>

<div class="error-card">

    <div class="error-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <h2>Oops!</h2>

    <div class="error-msg" th:text="${errorMsg}">
        Something went wrong.
    </div>

    <a href="/about" class="btn-back">
        <i class="bi bi-arrow-left"></i> Go Back
    </a>

</div>

</body>
</html>
