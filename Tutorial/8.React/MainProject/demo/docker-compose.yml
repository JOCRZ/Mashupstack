services:
  shlink:
    image: shlinkio/shlink:stable
    container_name: shlink
    ports:
      - "8080:8080"
    environment:
      - DEFAULT_DOMAIN=ziplink
      - IS_HTTPS_ENABLED=false
      - INITIAL_API_KEY=my-api-key-123
    volumes:
      - shlink_data:/data
    restart: unless-stopped

volumes:
  shlink_data:
