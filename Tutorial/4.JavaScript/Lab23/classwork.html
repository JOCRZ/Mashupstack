<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            border-style:solid;
            border-radius: 5px;
            display: grid;
            grid-template-rows: 50px 50px 50px;
            margin:auto;
            margin-top:100px;
            padding:20px;
            width:500px;
            height:190px;
        } 
    </style>
    <title>Document</title>
</head>
<body>
     <div class="container">
    <input type="text" id="input1" placeholder="Enter user Name">
    <input type="text" id="input2" placeholder="Enter user Birth Date ( YYYY-MM-DD )">
    <button onclick="getBirthdayDetails()">Check</button>
    <span id="result"></span>
    </div>

    <script>
        function getBirthdayDetails(){
            const friend = {
                            name : document.getElementById("input1").value,
                            birthDate : document.getElementById("input2").value

            };

            var name = friend.name;
            const parts = friend.birthDate.split("-"); 
            const dob = new Date(parts[0], parts[1] - 1, parts[2]);
        
            let today = new Date();

            
            let monthLabels = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            let year = dob.getFullYear();
            let month = dob.getMonth();
            let day = dob.getDate();
            let age = today.getFullYear() - dob.getFullYear() ;

            let m = today.getMonth() - month;

            if (m < 0 || (m === 0 && today.getDate() < day)) {
                age--;
            }

            
            document.getElementById("result").innerText =  `${name} was born on ${day} ${monthLabels[month]}, ${year} and is ${age} years old.`;
        }


    </script>
    
</body>
</html>
