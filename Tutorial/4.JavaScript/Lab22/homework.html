<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>



const results = [
    { name: "Arjun", score: 85 },
    { name: "Sneha", score: 92 },
    { name: "Vikram", score: 45 },
    { name: "Priya", score: 78 },
    { name: "Rohan", score: 33 },
    { name: "Ananya", score: 88 },
    { name: "Kabir", score: 61 },
    { name: "Isha", score: 95 },
    { name: "Meera", score: 52 },
    { name: "Aditya", score: 70 },
    { name: "Sino", score: 98 }
];
console.log("Mark list");
console.log(results);
console.log(" ")

var students = " ";

for (i = 0; i < results.length; i++) {
    students += results[i].name + " , ";

}
console.log("Students Names")
console.log(students);
console.log(" ")



const score60 = results.filter(item => {
    return item.score > 60; 
});
console.log("Students how scored more than 60");
console.log(score60);
console.log(" ")


var sum = results.reduce((accumulator, item) => {
    return accumulator + item.score; 
}, 0);
console.log("Total Marks")
console.log(sum); 
console.log(" ")


const score35 = results.filter(item => {
    return item.score < 35; 
});
console.log("Students how scored less than 35");
console.log(score35);
console.log(" ")

const score95 = results.filter(item => {
    return item.score > 95; 
});
console.log("Students how scored more than 95");
console.log(score95);
console.log(" ")


const sorting = results.sort((a, b) => b.score - a.score);
console.log("Sorted Result list")
console.log(sorting);
    </script>
</body>
</html>
