<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode</title>
</head>
<body>
    <h1 id="text"> Dark Mode </h1>
    <button  onclick="darkMode()">Click</button>
    

    <script>

        let mode = false;
        const bodyElement = document.querySelector('body');
        window.addEventListener('load', function(){
            let darks= JSON.parse(localStorage.getItem('dark'));
                color(darks.bgcolor,darks.color,darks.mode);
        })

        function color(bg,txt,mode){
                bodyElement.style.backgroundColor = bg;
                document.getElementById("text").style.color = txt;
                modes = mode;
                localStorage.setItem('dark',JSON.stringify({bgcolor:bg,color:txt,modes:mode}));
                return {bg,txt, mode};
        }


        function darkMode(){

            if (mode == false){
                color("black","white",true);
                mode = true;
            }
            else {
                color("white","black",false);
                mode = false; 
            }

        }

    </script>
</body>
</html>
