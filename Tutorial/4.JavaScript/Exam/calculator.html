<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Calculator</title>
</head>
<body>
 
    <div class="d-flex justify-content-center align-items-center vh-100">
    <input class="m-2 p-2" type="text" id="value1">

        <select class="m-2 p-2" name="operator" id="operator">
        <option value="add">+</option>
        <option value="sub">-</option>
        <option value="mul">×</option>
        <option value="div">÷</option>
        </select>

    <input class="m-2 p-2" type="text" id="value2">

    <button class="m-2 p-2" onclick="calculator()" id="equal">=</button>
    <span class="m-2 p-2 display-4 fw-normal" id="output"></span>

    </div>

    <script>

        function calculator(){

            let val1 = document.getElementById("value1").value;
            let val2 = document.getElementById("value2").value;
            let operator = document.getElementById("operator").value;
            let operation;
            const regex = /^\d+$/;

            if (regex.test(val1) && regex.test(val2) == true){
                num1 = parseFloat(val1);
                num2 = parseFloat(val2);
            }
            else{
                operator = "not number";
            }

            switch(operator){
                case "add":
                    operation = add(num1,num2).toFixed(2);
                    break;
                case "sub":
                    operation = sub(num1,num2).toFixed(2);
                    break;
                case "mul":
                    operation = mul(num1,num2).toFixed(2);
                    break;
                case "div":
                    operation = div(num1,num2);
                    break;
                default:
                    operation = "Invalid Input";
                    break;        

            }
            
        

            document.getElementById("output").innerHTML = operation;
        }

        function add(v1,v2){
            return v1+v2;
        };

        function sub(v1,v2){
            return v1-v2;
        };

        function mul(v1,v2){
            return v1*v2;
        };

        function div(v1,v2){
            if (v2 == 0){
                return "Zero Not Divisible"
            }else{
                return (v1/v2).toFixed(2);
            }

            
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
