<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>LotteryTicket</title>
</head>
<body>
    
<div class="modal fade shadow" tabindex="-1" id="myModal" >
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header d-flex justify-content-center align-items-center">
        <h5 class="modal-title text-success font-monospace fw-normal" id="exampleModalLabel">Lucky Draw Winner</h5>
      </div>
      
      <div class="modal-body d-flex justify-content-center align-items-center p-5 display-5 fw-normal" id="output"></div>

      <div class="modal-footer ">
        <button type="button" class="btn btn-secondary font-monospace" data-bs-dismiss="modal">Close</button>
      </div>
      
    </div>
  </div>
</div>

    <div class="d-flex flex-column justify-content-center align-items-center vh-100 " style="transform: translateY(100px);">
    <button  onclick="getLottery() " type="button" class="btn btn-primary p-3 border rounded font-monospace shadow fw-semibold" data-bs-toggle="modal" data-bs-target="#myModal" > Select Winner</button>
    <span id="output2" class="fs-4 fw-bold"></span>
    </div>

    
    
   
    <script>

        function getLottery(){

                let arr = [7, 14, 23, 38, 41, 49];

                let ran = Math.floor(Math.random()*arr.length);

                let winner = arr[ran];

                console.log(`The Lottery Winner is ${winner}`)
                document.getElementById("output").style.color = "red";
                document.getElementById("output").innerHTML = winner;
                document.getElementById("output2").style.color = "red";
                document.getElementById("output2").innerHTML = winner;

                

        }


    </script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
