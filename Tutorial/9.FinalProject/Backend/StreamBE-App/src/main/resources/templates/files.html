<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Movies Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.dropdown-menu {
	    max-height: 250px;
	    overflow-y: auto;
	}

	.dropdown-menu .form-check {
	    margin-bottom: 8px;
	}
	</style>
	</head>
<body>

    <div th:replace="~{/navbar :: admin-navbar('Content Management Dashboard')}"></div>

	<div class="container mt-4">

		<div th:if="${param.uploadSuccess}" class="alert alert-success alert-dismissible fade show">
			Movie uploaded successfully!
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${param.updateSuccess}" class="alert alert-success alert-dismissible fade show">
			Movie updated successfully!
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

<form th:action="@{/files}" method="get" class="row g-3 align-items-start">

	        <!-- Search -->
	        <div class="col-lg-4">
	            <input type="text" name="search"
	                   class="form-control"
	                   placeholder="Search Title..."
	                   th:value="${selectedSearch}"
	                   oninput="autoFilter(this)">
	        </div>

	        <!-- Language -->
	        <div class="col-lg-2">
	            <select name="language" class="form-select">
	                <option value="" th:selected="${selectedLanguage == null}">All Languages</option>
	                <option value="English" th:selected="${selectedLanguage == 'English'}">English</option>
	                <option value="Malayalam" th:selected="${selectedLanguage == 'Malayalam'}">Malayalam</option>
	                <option value="Japanese" th:selected="${selectedLanguage == 'Japanese'}">Japanese</option>
	                <option value="Hindi" th:selected="${selectedLanguage == 'Hindi'}">Hindi</option>
	            </select>
	        </div>

	        <!-- Release Year Dropdown -->
	        <div class="col-lg-2">
	            <div class="dropdown">
	                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start"
	                        type="button"
	                        data-bs-toggle="dropdown">
	                    Release Year
	                </button>

	                <div class="dropdown-menu p-3 w-100">
	                    <div class="form-check" th:each="y : ${distinctYears}">
	                        <input class="form-check-input" type="checkbox" name="year"
	                               th:value="${y}" th:id="'y' + ${y}"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, y)}">
	                        <label class="form-check-label" th:for="'y' + ${y}" th:text="${y}">2024</label>
	                    </div>
	                </div>
	            </div>
	        </div>

	        <!-- Buttons -->
	        <div class="col-auto">
	            <button type="submit" class="btn btn-primary px-4">Filter</button>
	        </div>

	        <div class="col-auto">
	            <a th:href="@{/files}" class="btn btn-outline-secondary px-4">Reset</a>
	        </div>

			<div class="col-auto">
			    <a th:href="@{/upload}" class="btn btn-outline-secondary px-4">Upload</a>
			</div>

	    </form>

	
		
		<div class="card mt-4 shadow-sm">
		    <div class="card-header bg-dark text-white">
		        <h5 class="mb-0">Content List</h5>
		    </div>

		    <div class="card-body p-0">

		        <table class="table table-hover table-striped mb-0 align-middle">

		            <thead class="table-dark">
		                <tr>
		                    <th>Content ID</th>
		                    <th>Title</th>
		                    <th>Play</th>
		                    <th>Edit</th>
		                    <th>Delete</th>
		                </tr>
		            </thead>

		            <tbody>
		                <tr th:each="movie : ${movies}">
		                    <td th:text="${movie.id}">1001</td>
		                    <td th:text="${movie.title}">Movie Title</td>

		                    <td>
		                        <a th:if="${movie.filePath != null}" th:href="@{/videos/{id}(id=${movie.id})}" class="btn btn-success btn-sm" target="_blank">Play</a>
		                        <span th:if="${movie.filePath == null}" class="text-muted small">No file</span>
		                    </td>

		                    <td>
		                        <a th:href="@{/edit(movieId=${movie.id})}" class="btn btn-warning btn-sm">Edit</a>
		                    </td>

		                    <td>
		                        <form th:action="@{/files/delete}" method="post" style="display:inline;">
		                            <input type="hidden" name="movieId" th:value="${movie.id}"/>
		                            <button type="button" class="btn btn-danger btn-sm"
		                                    data-bs-toggle="modal" data-bs-target="#deleteConfirmModal"
		                                    th:data-item-name="'Movie: ' + ${movie.title}">Delete</button>
		                        </form>
		                    </td>
		                </tr>
		            </tbody>

		        </table>

		    </div>
		</div>

	</div>
	
	</div>

	<!-- Delete Confirm Modal -->
	<div class="modal fade" id="deleteConfirmModal" tabindex="-1">
	    <div class="modal-dialog modal-sm modal-dialog-centered">
	        <div class="modal-content">
	            <div class="modal-header bg-danger text-white">
	                <h6 class="modal-title">Confirm Delete</h6>
	                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
	            </div>
	            <div class="modal-body" id="deleteModalBody"></div>
	            <div class="modal-footer">
	                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
	                <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
	            </div>
	        </div>
	    </div>
	</div>

	<script>
	let filterTimer;

	function autoFilter(el) {
	    clearTimeout(filterTimer);
	    const form = el.closest('form');
	    if (el.name === 'search') {
	        filterTimer = setTimeout(() => form.submit(), 500);
	    } else {
	        form.submit();
	    }
	}

	document.querySelectorAll('.dropdown-menu').forEach(menu => {
	    menu.addEventListener('click', function(e) {
	        e.stopPropagation();
	    });
	});

	let deleteTarget = null;

	document.getElementById('deleteConfirmModal').addEventListener('show.bs.modal', function(event) {
	    const btn = event.relatedTarget;
	    deleteTarget = btn.closest('form');
	    document.getElementById('deleteModalBody').textContent = 'Are you sure you want to delete ' + btn.dataset.itemName + '?';
	});

	document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
	    if (deleteTarget) deleteTarget.submit();
	});
	</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
