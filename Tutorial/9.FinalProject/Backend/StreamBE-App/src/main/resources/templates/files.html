<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Movies Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.dropdown-menu {
	    max-height: 250px;
	    overflow-y: auto;
	}

	.dropdown-menu .form-check {
	    margin-bottom: 8px;
	}
	</style>
	</head>
<body>

    <div th:replace="~{/navbar :: admin-navbar('Content Management Dashboard')}"></div>

	<div class="container mt-4">

<form th:action="@{/files}" method="get" class="row g-3 align-items-start">

	        <!-- Search -->
	        <div class="col-lg-4">
	            <input type="text" name="search"
	                   class="form-control"
	                   placeholder="Search Title..."
	                   th:value="${selectedSearch}"
	                   oninput="autoFilter(this)">
	        </div>

	        <!-- Language -->
	        <div class="col-lg-2">
	            <select name="language" class="form-select">
	                <option value="" th:selected="${selectedLanguage == null}">All Languages</option>
	                <option value="English" th:selected="${selectedLanguage == 'English'}">English</option>
	                <option value="Malayalam" th:selected="${selectedLanguage == 'Malayalam'}">Malayalam</option>
	                <option value="Japanese" th:selected="${selectedLanguage == 'Japanese'}">Japanese</option>
	                <option value="Hindi" th:selected="${selectedLanguage == 'Hindi'}">Hindi</option>
	            </select>
	        </div>

	        <!-- Release Year Dropdown -->
	        <div class="col-lg-2">
	            <div class="dropdown">
	                <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start"
	                        type="button"
	                        data-bs-toggle="dropdown">
	                    Release Year
	                </button>

	                <div class="dropdown-menu p-3 w-100">
	                    <div class="form-check">
	                        <input class="form-check-input" type="checkbox" name="year" value="2026" id="y2026"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, 2026)}">
	                        <label class="form-check-label" for="y2026">2026</label>
	                    </div>
	                    <div class="form-check">
	                        <input class="form-check-input" type="checkbox" name="year" value="2025" id="y2025"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, 2025)}">
	                        <label class="form-check-label" for="y2025">2025</label>
	                    </div>
	                    <div class="form-check">
	                        <input class="form-check-input" type="checkbox" name="year" value="2024" id="y2024"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, 2024)}">
	                        <label class="form-check-label" for="y2024">2024</label>
	                    </div>
	                    <div class="form-check">
	                        <input class="form-check-input" type="checkbox" name="year" value="2023" id="y2023"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, 2023)}">
	                        <label class="form-check-label" for="y2023">2023</label>
	                    </div>
	                    <div class="form-check">
	                        <input class="form-check-input" type="checkbox" name="year" value="2022" id="y2022"
	                               th:checked="${selectedYears != null and #lists.contains(selectedYears, 2022)}">
	                        <label class="form-check-label" for="y2022">2022</label>
	                    </div>
	                </div>
	            </div>
	        </div>

	        <!-- Buttons -->
	        <div class="col-auto">
	            <button type="submit" class="btn btn-primary px-4">Filter</button>
	        </div>

	        <div class="col-auto">
	            <a th:href="@{/files}" class="btn btn-outline-secondary px-4">Reset</a>
	        </div>

			<div class="col-auto">
			    <a th:href="@{/upload}" class="btn btn-outline-secondary px-4">Upload</a>
			</div>

	    </form>

	
		
		<div class="card mt-4 shadow-sm">
		    <div class="card-header bg-dark text-white">
		        <h5 class="mb-0">Content List</h5>
		    </div>

		    <div class="card-body p-0">

		        <table class="table table-hover table-striped mb-0 align-middle">

		            <thead class="table-dark">
		                <tr>
		                    <th>Content ID</th>
		                    <th>Title</th>
		                    <th>Preview</th>
		                    <th>Edit</th>
		                    <th>Delete</th>
		                </tr>
		            </thead>

		            <tbody>
		                <tr th:each="movie : ${movies}">
		                    <td th:text="${movie.id}">1001</td>
		                    <td th:text="${movie.title}">Movie Title</td>

		                    <td>
		                        <a th:href="@{/preview(movieId=${movie.id})}" class="btn btn-info btn-sm">Preview</a>
		                    </td>

		                    <td>
		                        <a th:href="@{/upload}" class="btn btn-warning btn-sm">Edit</a>
		                    </td>

		                    <td>
		                        <form th:action="@{/files/delete}" method="post" style="display:inline;"
		                              th:data-movie-title="${movie.title}"
		                              onsubmit="return confirm('Delete movie &quot;' + this.dataset.movieTitle + '&quot;?');">
		                            <input type="hidden" name="movieId" th:value="${movie.id}"/>
		                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
		                        </form>
		                    </td>
		                </tr>
		            </tbody>

		        </table>

		    </div>
		</div>

	</div>
	
	</div>
	
	<script>
	let filterTimer;

	function autoFilter(el) {
	    clearTimeout(filterTimer);
	    const form = el.closest('form');
	    if (el.name === 'search') {
	        filterTimer = setTimeout(() => form.submit(), 500);
	    } else {
	        form.submit();
	    }
	}

	document.querySelectorAll('.dropdown-menu').forEach(menu => {
	    menu.addEventListener('click', function(e) {
	        e.stopPropagation();
	    });
	});
	</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
