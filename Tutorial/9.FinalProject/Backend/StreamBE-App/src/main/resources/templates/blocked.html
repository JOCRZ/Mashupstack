<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Blocked</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-danger">
                    <div class="card-body py-5">
                        <div class="display-1 text-danger mb-4">&#9888;</div>
                        <h2 class="card-title text-danger mb-3">Account Blocked</h2>
                        <p class="card-text text-muted mb-4">
                            Your account has been blocked. You are unable to access the platform at this time.
                        </p>
                        <p class="card-text text-muted mb-4">
                            If you believe this is a mistake, please contact support.
                        </p>
                        <a href="/login" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
