<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Content</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>
body{
    background:#f8f9fa;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.preview-box{
    border:1px dashed #ced4da;
    border-radius:8px;
    padding:15px;
    text-align:center;
    background:white;
}

.preview-image{
    width:306px;
    height:460px;
    border:1px solid #dee2e6;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:12px;
}
.field-wrapper{
    position:relative;
}

.btn-clear{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    color:#999;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    z-index:5;
    padding:0 4px;
    display:none;
}

.btn-clear:hover{
    color:#dc3545;
}

.field-wrapper:hover .btn-clear{
    display:block;
}

.form-control:placeholder-shown ~ .btn-clear,
.form-select:has(option:checked[value=""]) ~ .btn-clear{
    display:none;
}
</style>

</head>
<body>

<div th:replace="~{/navbar :: admin-navbar('Upload Content')}"></div>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">Upload Content</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/upload}" method="post" enctype="multipart/form-data" id="uploadForm">

                <div th:if="${param.error}" class="alert alert-danger">Upload failed. Please try again.</div>
                <div th:if="${param.success}" class="alert alert-success">Movie uploaded successfully!</div>

                <div class="row">
                    <div class="col-lg-5 field-wrapper">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" id="fetchTitle" required oninput="toggleClear(this)">
                        <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                    </div>
                    <div class="col-lg-3 field-wrapper">
                        <label class="form-label">Year</label>
                        <input type="number" name="year" class="form-control" id="fetchYear" min="1900" max="2099" required oninput="toggleClear(this)">
                        <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                    </div>
                    <div class="col-lg-2 d-flex align-items-end">
                        <button type="button" class="btn btn-primary w-100" id="fetchBtn" onclick="fetchMovie()">Fetch</button>
                    </div>
                    <div class="col-lg-2 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-secondary w-100" onclick="clearAll()">Clear All</button>
                    </div>
                </div>

                <div class="mb-3 mt-3 field-wrapper">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" id="fetchDescription" rows="5" required oninput="toggleClear(this)"></textarea>
                    <button type="button" class="btn-clear" onclick="clearField(this)" style="top:42px;transform:none;" tabindex="-1">×</button>
                </div>

                <div class="row">
                    <div class="col-lg-4 field-wrapper">
                        <label class="form-label">Rating</label>
                        <input type="number" name="rating" class="form-control" id="fetchRating" step="0.1" min="0" max="10" required oninput="toggleClear(this)">
                        <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                    </div>
                    <div class="col-lg-4 field-wrapper">
                        <label class="form-label">Duration</label>
                        <input type="text" name="duration" class="form-control" id="fetchDuration" placeholder="e.g. 2h 30m" required oninput="toggleClear(this)">
                        <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                    </div>
                    <div class="col-lg-4 field-wrapper">
                        <label class="form-label">Language</label>
                        <select name="language" class="form-select" id="fetchLanguage" required onchange="toggleClear(this)">
                            <option value="">Select</option>
                            <option>English</option>
                            <option>Malayalam</option>
                            <option>Japanese</option>
                            <option>Hindi</option>
                        </select>
                        <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                    </div>
                </div>

                <hr class="mt-4">

                <h5>Images</h5>
                <div class="row mt-3">
                    <div class="col-lg-6 field-wrapper">
                        <label class="form-label">Image</label>
                        <input type="file" name="image" class="form-control" accept="image/*" id="imageInput" onchange="previewImage(this, 'imagePreview');toggleClear(this);document.getElementById('imageUrl').value=''">
                        <input type="hidden" name="imageUrl" id="imageUrl">
                        <button type="button" class="btn-clear" onclick="clearFileField(this, 'imagePreview', 'Image Preview');document.getElementById('imageUrl').value=''" tabindex="-1">×</button>
                        <div class="preview-box mt-3">
                            <div class="preview-image" id="imagePreview">Image Preview</div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="field-wrapper">
                            <label class="form-label">Video File</label>
                            <input type="file" name="videoFile" class="form-control" accept="video/*" id="videoFileInput" required onchange="toggleClear(this)">
                            <button type="button" class="btn-clear" onclick="clearVideoField(this)" tabindex="-1">×</button>
                        </div>
                        <div class="field-wrapper mt-3">
                            <label class="form-label">Rename Video</label>
                            <input type="text" name="videoName" class="form-control" placeholder="Enter custom filename (no extension)" id="videoNameInput" required oninput="toggleClear(this)">
                            <button type="button" class="btn-clear" onclick="clearField(this)" tabindex="-1">×</button>
                        </div>
                        <div id="videoPreviewContainer" style="display:none;" class="mt-3">
                            <label class="form-label">Video Preview</label>
                            <video id="videoPreview" controls style="width:100%;max-height:300px;background:#000;border-radius:8px;"></video>
                        </div>
                    </div>
                </div>

                <hr class="mt-4">

                <div class="mt-4">
                    <button type="submit" class="btn btn-success w-100">Upload Movie</button>
                </div>

            </form>

        </div>
    </div>
</div>

<script>
function previewImage(input, previewId) {
    const preview = document.getElementById(previewId);
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:100%;object-fit:contain">';
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function toggleClear(el) {
    const btn = el.parentElement.querySelector('.btn-clear');
    if (!btn) return;
    if (el.type === 'file') {
        btn.style.display = el.files.length > 0 ? 'block' : 'none';
    } else if (el.tagName === 'SELECT') {
        btn.style.display = el.value ? 'block' : 'none';
    } else {
        btn.style.display = el.value ? 'block' : 'none';
    }
}

function clearField(btn) {
    const wrapper = btn.parentElement;
    const input = wrapper.querySelector('input, textarea, select');
    if (!input) return;
    input.value = '';
    if (input.tagName === 'SELECT') input.selectedIndex = 0;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    btn.style.display = 'none';
}

function clearFileField(btn, previewId, placeholder) {
    const wrapper = btn.parentElement;
    const input = wrapper.querySelector('input[type="file"]');
    if (input) {
        input.value = '';
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const preview = document.getElementById(previewId);
    if (preview) preview.textContent = placeholder;
    btn.style.display = 'none';
}

function clearVideoField(btn) {
    const wrapper = btn.parentElement;
    const input = wrapper.querySelector('input[type="file"]');
    if (input) {
        input.value = '';
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const container = document.getElementById('videoPreviewContainer');
    const video = document.getElementById('videoPreview');
    if (video) video.src = '';
    if (container) container.style.display = 'none';
    btn.style.display = 'none';
}

function clearAll() {
    document.getElementById('uploadForm').reset();
    document.querySelectorAll('.preview-image').forEach(el => {
        el.textContent = 'Image Preview';
    });
    const container = document.getElementById('videoPreviewContainer');
    const video = document.getElementById('videoPreview');
    if (video) video.src = '';
    if (container) container.style.display = 'none';
    document.querySelectorAll('.btn-clear').forEach(btn => btn.style.display = 'none');
}

async function fetchMovie() {
    const title = document.getElementById('fetchTitle').value.trim();
    const year = document.getElementById('fetchYear').value.trim();
    if (!title || !year) {
        alert('Enter both title and year');
        return;
    }

    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    btn.textContent = 'Fetching...';

    try {
        const res = await fetch('/fetch-movie?title=' + encodeURIComponent(title) + '&year=' + year);
        const data = await res.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById('fetchDescription').value = data.description || '';

        const rating = document.getElementById('fetchRating');
        rating.value = data.rating || '';
        rating.dispatchEvent(new Event('input', { bubbles: true }));

        const duration = document.getElementById('fetchDuration');
        duration.value = data.duration || '';
        duration.dispatchEvent(new Event('input', { bubbles: true }));

        const lang = document.getElementById('fetchLanguage');
        if (data.language) {
            const options = lang.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value.toUpperCase() === data.language.toUpperCase()) {
                    lang.selectedIndex = i;
                    break;
                }
            }
        }
        lang.dispatchEvent(new Event('change', { bubbles: true }));

        if (data.poster) {
            document.getElementById('imagePreview').innerHTML = '<img src="' + data.poster + '" style="max-width:100%;max-height:100%;object-fit:contain">';
            document.getElementById('imageUrl').value = data.poster;
            document.getElementById('imageInput').value = '';
        }
    } catch (e) {
        alert('Failed to fetch movie details');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch';
    }
}

document.getElementById('videoFileInput').addEventListener('change', function() {
    const nameInput = document.getElementById('videoNameInput');
    if (this.files.length > 0 && !nameInput.value) {
        const name = this.files[0].name;
        nameInput.value = name.substring(0, name.lastIndexOf('.')) || name;
    }

    const container = document.getElementById('videoPreviewContainer');
    const video = document.getElementById('videoPreview');
    if (this.files && this.files[0]) {
        video.src = URL.createObjectURL(this.files[0]);
        container.style.display = 'block';
    } else {
        video.src = '';
        container.style.display = 'none';
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
