<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Content</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.preview-box{
    border:1px dashed #ced4da;
    border-radius:8px;
    padding:15px;
    text-align:center;
    background:white;
}

.preview-small{
    width:322px;
    height:230px;
    border:1px solid #dee2e6;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}

.preview-large{
    width:615px;
    height:415px;
    border:1px solid #dee2e6;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}
</style>

</head>
<body>

<div th:replace="~{/navbar :: admin-navbar('Upload Content')}"></div>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h4 class="mb-0">Upload Content</h4>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">Movie Title</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="5"></textarea>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <label class="form-label">Thumbnail (322 × 230)</label>
                    <input type="file" class="form-control">
                    <div class="preview-box mt-3">
                        <div class="preview-small">322 × 230 Preview</div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <label class="form-label">Thumbnail (615 × 415)</label>
                    <input type="file" class="form-control">
                    <div class="preview-box mt-3">
                        <div class="preview-large">615 × 415 Preview</div>
                    </div>
                </div>
            </div>

            <hr>

            <h5>Movie Upload</h5>

            <div class="mb-3">
                <label class="form-label">Movie File</label>
                <input type="file" class="form-control">
            </div>

            <div class="mt-4">
                <button class="btn btn-success">Submit</button>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
