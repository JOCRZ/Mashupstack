<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{/navbar :: admin-navbar('User Management Dashboard')}"></div>

    <div class="container mt-4">

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">User List</h5>
                <span class="badge bg-light text-dark" th:text="${#lists.size(users)} + ' users'">0 users</span>
            </div>

            <div class="card-body p-0">

                <form th:action="@{/users}" method="get" class="row g-3 p-3 border-bottom align-items-start">

                    <div class="col-lg-4">
                        <input type="text" name="search" class="form-control"
                               placeholder="Search Name or Email..."
                               th:value="${selectedSearch}"
                               oninput="autoFilter(this)">
                    </div>

                    <div class="col-lg-2">
                        <select name="role" class="form-select">
                            <option value="" th:selected="${selectedRole == null}">All Roles</option>
                            <option value="admin" th:selected="${selectedRole == 'admin'}">Admin</option>
                            <option value="user" th:selected="${selectedRole == 'user'}">User</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <select name="blockStatus" class="form-select">
                            <option value="" th:selected="${selectedBlockStatus == null}">All Status</option>
                            <option value="blocked" th:selected="${selectedBlockStatus == 'blocked'}">Blocked</option>
                            <option value="active" th:selected="${selectedBlockStatus == 'active'}">Active</option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary px-4">Filter</button>
                    </div>
                    <div class="col-auto">
                        <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Reset</a>
                    </div>
                </form>

                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Analysis</th>
                            <th>Block</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1001</td>
                            <td th:text="${user.name}">John Doe</td>
                            <td th:text="${user.email}">john@example.com</td>

                            <td>
                                <span class="badge" th:classappend="${user.role} ? 'bg-primary' : 'bg-secondary'"
                                      th:text="${user.role} ? 'Admin' : 'User'">User</span>
                            </td>

                            <td th:if="!${user.role}">
                                <a th:href="@{/view(userId=${user.id})}" class="btn btn-info btn-sm">Analysis</a>
                            </td>
                            <td th:if="${user.role}">—</td>

                            <td th:if="!${user.role}">
                                <form th:action="@{/users/block}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${user.id}"/>
                                    <button type="button" class="btn btn-sm"
                                            th:classappend="${user.block_status} ? 'btn-success' : 'btn-warning'"
                                            data-bs-toggle="modal" data-bs-target="#blockConfirmModal"
                                            th:data-item-name="${user.name}"
                                            th:data-action="${user.block_status} ? 'Unblock' : 'Block'"
                                            th:text="${user.block_status} ? 'Unblock' : 'Block'">Block</button>
                                </form>
                            </td>
                            <td th:if="${user.role}">—</td>

                            <td th:if="!${user.role}">
                                <form th:action="@{/users/delete}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${user.id}"/>
                                    <button type="button" class="btn btn-danger btn-sm"
                                            data-bs-toggle="modal" data-bs-target="#deleteConfirmModal"
                                            th:data-item-name="'User: ' + ${user.name}">Delete</button>
                                </form>
                            </td>
                            <td th:if="${user.role}">—</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </div>

    <!-- Block Confirm Modal -->
    <div class="modal fade" id="blockConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h6 class="modal-title">Confirm</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="blockModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning btn-sm" id="confirmBlockBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h6 class="modal-title">Confirm Delete</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="deleteModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    let filterTimer;

    function autoFilter(el) {
        clearTimeout(filterTimer);
        const form = el.closest('form');
        if (el.name === 'search') {
            filterTimer = setTimeout(() => form.submit(), 500);
        } else {
            form.submit();
        }
    }

    let deleteTarget = null;

    document.getElementById('deleteConfirmModal').addEventListener('show.bs.modal', function(event) {
        const btn = event.relatedTarget;
        deleteTarget = btn.closest('form');
        document.getElementById('deleteModalBody').textContent = 'Are you sure you want to delete ' + btn.dataset.itemName + '?';
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        if (deleteTarget) deleteTarget.submit();
    });

    let blockTarget = null;

    document.getElementById('blockConfirmModal').addEventListener('show.bs.modal', function(event) {
        const btn = event.relatedTarget;
        blockTarget = btn.closest('form');
        document.getElementById('blockModalBody').textContent = 'Are you sure you want to ' + btn.dataset.action + ' user ' + btn.dataset.itemName + '?';
    });

    document.getElementById('confirmBlockBtn').addEventListener('click', function() {
        if (blockTarget) blockTarget.submit();
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
