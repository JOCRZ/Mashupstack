<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{/navbar :: admin-navbar('User Management Dashboard')}"></div>

	<div class="container mt-4">

	    <div class="row g-4 align-items-center">

	        <!-- Search -->
	        <div class="col-lg-4 col-md-6">
	            <input type="text"
	                   class="form-control"
	                   placeholder="Search name or email...">
	        </div>


	        <!-- Account Type -->
	        <div class="col-lg-2 col-md-3">
	            <select class="form-select">
	                <option selected> Subscription</option>
	                <option>Free</option>
	                <option>Premium</option>
	            </select>
	        </div>

	        <!-- Email Verified -->
	        <div class="col-lg-2 col-md-3">
	            <select class="form-select">
	                <option selected> Verified</option>
	                <option>Yes</option>
	                <option>No</option>
	            </select>
	        </div>

	        <!-- Country -->
	        <div class="col-lg-2 col-md-3">
	            <select class="form-select">
	                <option selected>Country</option>
	                <option>India</option>
	                <option>USA</option>
	                <option>UK</option>
	                <option>Canada</option>
	            </select>
	        </div>

	        <!-- Locked Account -->
	        <div class="col-lg-2 col-md-3">
	            <select class="form-select">
	                <option selected>Blocked</option>
	                <option>Yes</option>
	                <option>No</option>
	            </select>
	        </div>

	        <!-- Sort By -->
	        <div class="col-lg-3 col-md-4">
	            <select class="form-select">
	                <option selected>Sort By</option>
	                <option>Name A-Z</option>
	                <option>Name Z-A</option>
	                <option>Most Active</option>
	                <option>Newest Registered</option>
	                <option>Oldest Registered</option>
	                <option>Last Login</option>
	                <option>Last Logout</option>
	                <option>Highest Spending</option>
	            </select>
	        </div>

	        <!-- Filter Button -->
	        <div class="col-auto">
	            <button class="btn btn-primary px-4">
	                Filter
	            </button>
	        </div>

	        <!-- Reset Button -->
	        <div class="col-auto">
	            <button class="btn btn-outline-secondary px-4">
	                Reset
	            </button>
	        </div>

	  

	</div>
		
		<div class="card mt-4 shadow-sm">
		    <div class="card-header bg-dark text-white">
		        <h5 class="mb-0">User List</h5>
		    </div>

		    <div class="card-body p-0">

		        <table class="table table-hover table-striped mb-0 align-middle">

		            <thead class="table-dark">
		                <tr>
		                    <th>User ID</th>
		                    <th>Name</th>
		                    <th>Email</th>
		                    <th>Status</th>
		                    <th>Analysis</th>
		                    <th>Block</th>
		                    <th>Delete</th>
		                </tr>
		            </thead>

		            <tbody>

		                <tr>
		                    <td>1001</td>
		                    <td>John Doe</td>
		                    <td>john@example.com</td>

		                    <td>
		                        <span class="badge bg-success">
		                            Active
		                        </span>
		                    </td>

							<td>
							    <a th:href="@{/view}"
							       class="btn btn-info btn-sm">
							        Analysis
							    </a>
							</td>

		                    <td>
		                        <button class="btn btn-warning btn-sm">
		                            Block
		                        </button>
		                    </td>

		                    <td>
		                        <button class="btn btn-danger btn-sm">
		                            Delete
		                        </button>
		                    </td>
		                </tr>

		            </tbody>

		        </table>

		    </div>
		</div>

	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
