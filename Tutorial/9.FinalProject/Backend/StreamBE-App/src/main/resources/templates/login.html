<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Google Fonts Link -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

	
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
	<div class="card-body p-4">
		
		<h3 class="card-title text-center mb-4">Admin Login</h3>
		
		<p th:if="${param.error}" style="color: red; text-align: center; margin-bottom: 12px;">Invalid email or password</p>
		
	<form action="/login" method="POST">
		
		<div class="mb-3">
			<label for="email" class="form-label">Email </label>
			<input type="text" class="form-control" id="email" name="email" placeholder="name@gmail.com" required>
		</div>
		
		<div class="mb-3">
			<label for="password" class="form-label">Password </label>
			<input type="password" class="form-control" id="password" name="password"  placeholder="password" required>
		</div>
		
		<div class="mb-3">
			<button type="submit" class="btn btn-primary w-100 py-2"> Login </button>
		</div>
	</form>
	
	</div>
	</div>

</body>
</html>
