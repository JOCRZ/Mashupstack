<!DOCTYPE html>
<html lang="en">

    <title>Web devlopment</title>

    <div class="container">

    <dl class="col">
                <div class="row">

                    <div class="col-12 m-3 shadow rounded p-4">
                    <dt>HTML</dt> 
                    <dd><div class="col-12">
                            <div class="progress" style="height:1.5rem">
                                <div class="progress-bar bg-success progress-bar-striped " style="width:100%">100%</div>
                            </div>
                        </div>
                    </dd>
                    </div>

                    <div class="col-12 m-3 shadow rounded p-4">
                    <dt>CSS</dt>
                    <dd><div class="col-12">
                            <div class="progress" style="height:1.5rem">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:75%">75%</div>
                            </div>
                        </div>
                    </dd>
                    </div>

                    <div class="col-12 m-3 shadow rounded p-4">
                    <dt>Java Script</dt>
                    <dd><div class="col-12">
                            <div class="progress" style="height:1.5rem">
                                <div class="progress-bar bg-warning" style="width:50%">50%</div>
                            </div>
                        </div>
                    </dd>
                    </div>

                    <div class="col-12 m-3 shadow rounded p-4">
                    <dt>Bootstrap</dt>
                    <dd><div class="col-12">
                            <div class="progress" style="height:1.5rem">
                                <div class="progress-bar bg-danger" style="width:25%">25%</div>
                            </div>
                        </div>
                    </dd>
                    </div>
            </div>    
    </dl>

        <button class="btn bg-success w-100 py-2 text-white" type="button">Start</button>
    </div>
    <div class="col-3">
        <button class="btn bg-warning w-100 py-2 text-white" type="button">Pause</button>
    </div>
    <div class="col-3">
        <button class="btn bg-danger w-100 py-2 text-white" type="button">Stop</button>
    </div>
    </div>

    <div class="col m-4">
            <ul class="pagination justify-content-center ">
