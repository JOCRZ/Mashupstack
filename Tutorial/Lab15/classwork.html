<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>Feedback</title>
</head>
<body>
    <div class="container">
        <h1 class="display-4 text-center my-2">Feedback</h1>

        <div class="col-10 mx-auto my-2">

            <div class="form-group">
                    <label for="text">Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter name" name="name">
            </div>


            <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
            </div>

            
            <div class="form-group">
                    <label for="comment">Comment:</label>
                    <textarea type="text" class="form-control" id="comment"  placeholder="Enter review" rows="3"></textarea>
            </div>


            <div class="form-group">
                    <label for="sel1">How you know about us:</label>
                    <select class="form-control" id="sel1">
                        <option>Instagram</option>
                        <option>Youtube</option>
                        <option>Friend</option>
                        <option>Advertisment</option>
                    </select>
            </div>

            <label for="sel1">Satisfaction level:</label> <br>

                    <div class="form-check-inline">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input "name="optradio">poor
                    </label>
                    </div>

                    <div class="form-check-inline">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input"name="optradio" >fair
                    </label>
                    </div>

                    <div class="form-check-inline disabled">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input" name="optradio" >good
                    </label>
                    </div> 

                    <div class="form-check-inline disabled">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input" name="optradio" >very good
                    </label>
                    </div> 

                    <div class="form-check-inline disabled">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input" name="optradio" >amazing
                    </label>
                    </div> <br>


            <button  type="submit" class="btn btn-primary float-right">Submit</button>


        </div>

    </div>
    






    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
