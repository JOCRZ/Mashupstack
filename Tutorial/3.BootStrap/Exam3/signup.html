<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>Signup</title>
</head>
<body class="bg-primary overflow-hidden">

    <div class="container bg-primary" > <!--Main Container -->
           <div class="row"> <!--Main Wrapper-->
                    <div class="col-12 bg-primary" > <!--Form Seciton-->

                            <div class="container-fluid mt-5 p-5 bg-white rounded">
                                <h1 class="font-weight-bold">Sign Up</h1>
                                <p class="text-secondary">Please fill in this form to create an account</p>

                                <div class="row">
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                        <input type="email" class="form-control bg-light border-0" id="email" placeholder="First Name" name="email">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                        <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Last Name" name="pswd">
                                    </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Email" name="pswd">
                                </div>

                                <div class="form-group">
                                <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Password" name="pswd">
                                </div>
                                
                                <div class="form-group">
                                <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Confirm Password" name="pswd">
                                </div>

                                <div class="form-group form-check">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" name="remember"> I accept the <span><a href="#">Terms of Use & Privacy Policy.</a></span>
                                </label>
                                </div>
                                <button type="submit" class="btn btn-primary font-weight-bold" style="width:180px">Sign Up</button>
                                </div>
                                 <div class="text-center text-white mt-2" > <!--Text Seciton-->
                                        <p>Already have an account? <span><a class="text-white" href="#"> Login here </a></span></p>
                                </div>
                                
                            </div>

                            
            </div>

            
    </div>





    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
